# Prometheus alert rules for Snatchers Backend

groups:
  - name: snatchers-backend-alerts
    rules:
      # High error rate
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} for the last 5 minutes"

      # High response time
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High response time detected"
          description: "95th percentile response time is {{ $value }}s"

      # High memory usage
      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value | humanizePercentage }}"

      # High CPU usage
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value }}%"

      # Database connection issues
      - alert: DatabaseConnectionDown
        expr: mongodb_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Database connection down"
          description: "MongoDB connection is down"

      # Redis connection issues
      - alert: RedisConnectionDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis connection down"
          description: "Redis connection is down"

      # Elasticsearch connection issues
      - alert: ElasticsearchConnectionDown
        expr: elasticsearch_cluster_health_status != 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Elasticsearch cluster unhealthy"
          description: "Elasticsearch cluster health is not green"

      # Application down
      - alert: ApplicationDown
        expr: up{job="snatchers-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Application is down"
          description: "Snatchers backend application is not responding"

      # Disk space low
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space"
          description: "Disk space is {{ $value | humanizePercentage }} full"

      # Too many open file descriptors
      - alert: TooManyOpenFiles
        expr: node_filefd_allocated / node_filefd_maximum > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Too many open file descriptors"
          description: "{{ $value | humanizePercentage }} of file descriptors are in use"

  - name: business-metrics-alerts
    rules:
      # Low order conversion rate
      - alert: LowOrderConversionRate
        expr: rate(orders_completed_total[1h]) / rate(cart_created_total[1h]) < 0.02
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Low order conversion rate"
          description: "Order conversion rate is {{ $value | humanizePercentage }}"

      # High cart abandonment rate
      - alert: HighCartAbandonmentRate
        expr: 1 - (rate(orders_completed_total[1h]) / rate(cart_created_total[1h])) > 0.95
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "High cart abandonment rate"
          description: "Cart abandonment rate is {{ $value | humanizePercentage }}"

      # Payment failures
      - alert: HighPaymentFailureRate
        expr: rate(payment_failed_total[5m]) / rate(payment_attempted_total[5m]) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High payment failure rate"
          description: "Payment failure rate is {{ $value | humanizePercentage }}"