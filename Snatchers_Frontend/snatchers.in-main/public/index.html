<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    
    <!-- Preconnect to external domains for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="preconnect" href="https://checkout.razorpay.com">
    
    <!-- Critical CSS and fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital@0;1&family=Montserrat:wght@600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Italiana&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- Viewport and basic meta tags -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="light dark" />
    
    <!-- SEO and description -->
    <meta name="description" content="Discover premium jewelry, fashion, and lifestyle products with Snatchers - your ultimate shopping destination. Shop the latest trends with fast delivery and secure payments." />
    <meta name="keywords" content="jewelry, fashion, shopping, e-commerce, premium products, online store, lifestyle" />
    <meta name="author" content="Snatchers" />
    
    <!-- Open Graph meta tags -->
    <meta property="og:title" content="Snatchers - Premium E-commerce Platform" />
    <meta property="og:description" content="Discover premium jewelry, fashion, and lifestyle products with Snatchers - your ultimate shopping destination." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://snatchers.in" />
    <meta property="og:image" content="%PUBLIC_URL%/logo512.png" />
    <meta property="og:site_name" content="Snatchers" />
    
    <!-- Twitter Card meta tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Snatchers - Premium E-commerce Platform" />
    <meta name="twitter:description" content="Discover premium jewelry, fashion, and lifestyle products with Snatchers." />
    <meta name="twitter:image" content="%PUBLIC_URL%/logo512.png" />
    
    <!-- PWA meta tags -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/logo192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Snatchers" />
    
    <!-- Microsoft tiles -->
    <meta name="msapplication-TileColor" content="#000000" />
    <meta name="msapplication-TileImage" content="%PUBLIC_URL%/logo192.png" />
    <meta name="msapplication-config" content="%PUBLIC_URL%/browserconfig.xml" />
    
    <!-- Manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <!-- Performance hints -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com">
    <link rel="dns-prefetch" href="//cdnjs.cloudflare.com">
    <link rel="dns-prefetch" href="//checkout.razorpay.com">
    
    <title>Snatchers - Premium E-commerce Platform</title>
    
    <!-- Critical scripts -->
    <script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>
    
    <!-- Structured data for SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Snatchers",
      "description": "Premium e-commerce platform for jewelry, fashion, and lifestyle products",
      "url": "https://snatchers.in",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://snatchers.in/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      },
      "sameAs": [
        "https://facebook.com/snatchers",
        "https://instagram.com/snatchers",
        "https://twitter.com/snatchers"
      ]
    }
    </script>
  </head>
  <body>
    <noscript>
      <div style="text-align: center; padding: 50px; font-family: Arial, sans-serif;">
        <h1>JavaScript Required</h1>
        <p>You need to enable JavaScript to run this app.</p>
        <p>Please enable JavaScript in your browser settings and refresh the page.</p>
      </div>
    </noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
